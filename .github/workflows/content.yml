name: content

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/build-readme.ts'
      - 'content.config.ts'
  pull_request:
    paths:
      - 'content/**'
      - 'scripts/build-readme.ts'
      - 'content.config.ts'

jobs:
  readme:
    name: README in sync with content/
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - if: github.event_name == 'pull_request'
        run: bun run readme:check
      - if: github.event_name == 'push'
        run: bun run readme
      - if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: sync README from content/"
            git push
          else
            echo "README already up to date"
          fi

  build:
    name: worker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
